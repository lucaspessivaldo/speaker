<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<title>Revisão Espaçada — 1000 English Sentences</title>
<style>
  :root {
    --bg: #eef1f8;
    --card: #ffffff;
    --ink: #1a2233;
    --muted: #6f7789;
    --line: #e5e9f1;
    --primary: #3b5bdb;
    --radius: 20px;
    --shadow: 0 1px 2px rgba(20,30,60,.05), 0 14px 34px -12px rgba(20,30,60,.22);
    --shadow-sm: 0 1px 2px rgba(20,30,60,.05), 0 6px 16px -10px rgba(20,30,60,.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1100px 480px at 50% -12%, #dee7fb 0%, rgba(222,231,251,0) 62%), var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  header {
    background: linear-gradient(118deg, #1a73e8 0%, #4f46e5 100%);
    color: #fff;
    box-shadow: 0 2px 14px rgba(26,45,110,.22);
    position: sticky; top: 0; z-index: 50;
  }
  .head-inner {
    max-width: 900px; margin: 0 auto;
    padding: .7rem 1rem;
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  }
  .brand { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  nav { display: flex; gap: .35rem; }
  nav a, nav span {
    font-size: .82rem; font-weight: 600; text-decoration: none;
    padding: .34rem .7rem; border-radius: 999px;
    color: #fff; background: rgba(255,255,255,.16);
    transition: background .15s;
  }
  nav a:hover { background: rgba(255,255,255,.3); }
  nav .current { background: #fff; color: #1a73e8; }

  /* ---------- layout ---------- */
  .wrap { max-width: 720px; margin: 0 auto; padding: 1.1rem 1rem 3rem; }
  .hidden { display: none !important; }

  /* ---------- status bar ---------- */
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; margin-bottom: .7rem; flex-wrap: wrap;
  }
  .pills { display: flex; gap: .4rem; flex-wrap: wrap; }
  .pill {
    font-size: .78rem; font-weight: 600; color: var(--muted);
    background: #fff; border: 1px solid var(--line);
    padding: .28rem .65rem; border-radius: 999px;
    display: inline-flex; align-items: center; gap: .35rem;
    box-shadow: 0 1px 2px rgba(20,30,60,.04);
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .pill b { font-variant-numeric: tabular-nums; color: var(--ink); }
  .dot-new { background: #3b82f6; }
  .dot-due { background: #12a150; }
  .dot-relearn { background: #ef5a4e; }
  .gear {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
    padding: .3rem .7rem; border-radius: 999px;
    box-shadow: 0 1px 2px rgba(20,30,60,.04);
    transition: color .15s, border-color .15s;
  }
  .gear:hover { color: var(--primary); border-color: #c9d4ea; }

  .progress {
    height: 6px; background: #dde3ef; border-radius: 999px;
    overflow: hidden; margin-bottom: 1.1rem;
  }
  .progress span {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #4f7ff5, #4f46e5);
    border-radius: 999px; transition: width .35s ease;
  }

  /* ---------- ajustes ---------- */
  .panel {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow-sm);
    padding: .35rem 1.1rem; margin-bottom: 1.1rem;
  }
  .prow {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; padding: .7rem 0; border-bottom: 1px solid var(--line);
    font-size: .9rem;
  }
  .prow:last-of-type { border-bottom: none; }
  .prow label { color: var(--ink); font-weight: 500; }
  .prow select {
    font: inherit; font-size: .88rem; padding: .32rem .5rem;
    border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink);
  }
  .linkbtns { display: flex; gap: .5rem; flex-wrap: wrap; }
  .mini {
    font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: .35rem .7rem; border-radius: 9px; transition: color .15s, border-color .15s;
  }
  .mini:hover { color: var(--primary); border-color: #c9d4ea; }
  .mini.danger:hover { color: #d93a2e; border-color: #f3c5c0; }

  /* ---------- banner ---------- */
  .banner {
    background: #fff8e6; border: 1px solid #f2dfae; color: #6b5312;
    border-radius: 14px; padding: .8rem 1rem; margin-bottom: 1.1rem;
    font-size: .88rem; display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; flex-wrap: wrap;
  }

  /* ---------- cartão ---------- */
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 1.5rem 1.5rem 1.4rem; text-align: center;
  }
  .card-top {
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    margin-bottom: 1.4rem;
  }
  .numbadge {
    font-size: .78rem; font-weight: 700; color: var(--muted);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }
  .tag {
    font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: .18rem .55rem; border-radius: 999px;
  }
  .tag-new { background: #e8effe; color: #2c5fd0; }
  .tag-due { background: #e5f6ec; color: #0d7a41; }
  .tag-relearn { background: #fdeceb; color: #c33f34; }

  .sentence {
    font-size: clamp(1.18rem, 2.7vw, 1.55rem); line-height: 1.5; font-weight: 500;
    letter-spacing: -.01em;
    max-width: 30em; margin: 0 auto 1.5rem;
    animation: rise .22s ease;
  }
  .sentence b {
    font-weight: 700;
    background: linear-gradient(transparent 58%, #ffe083 58%);
    padding: 0 .1em; border-radius: 3px;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .play {
    display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
    min-height: 52px; padding: 0 1.6rem;
    border: none; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 1rem; font-weight: 700; color: #fff;
    background: linear-gradient(140deg, #5581f7, #3b5bdb);
    box-shadow: 0 11px 22px -12px rgba(59,91,219,.95);
    transition: transform .12s ease, filter .15s;
  }
  .play:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .play:active { transform: scale(.98); }
  .play .ico { font-size: .95rem; line-height: 1; }
  .play.playing { animation: ring 1.5s ease-out infinite; }
  @keyframes ring {
    0%   { box-shadow: 0 0 0 0 rgba(59,91,219,.38), 0 11px 22px -12px rgba(59,91,219,.95); }
    70%  { box-shadow: 0 0 0 16px rgba(59,91,219,0), 0 11px 22px -12px rgba(59,91,219,.95); }
    100% { box-shadow: 0 0 0 0 rgba(59,91,219,0), 0 11px 22px -12px rgba(59,91,219,.95); }
  }
  .hint { font-size: .82rem; color: var(--muted); margin-top: .85rem; }

  .ratings { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; margin-top: 1.5rem; }
  .ratings button {
    border: none; border-radius: 14px; cursor: pointer; color: #fff;
    font: inherit; font-size: .98rem; font-weight: 700;
    min-height: 64px; padding: .6rem .3rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
    box-shadow: 0 8px 16px -10px rgba(10,20,40,.75);
    transition: transform .1s, filter .15s;
  }
  .ratings button small { font-size: .74rem; font-weight: 600; opacity: .92; }
  .ratings button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .ratings button:active { transform: scale(.98); }
  .r-again { background: linear-gradient(140deg, #f0655a, #d93a2e); }
  .r-hard  { background: linear-gradient(140deg, #f2ab35, #dd8500); }
  .r-good  { background: linear-gradient(140deg, #2fbd7a, #0f9d58); }

  .keys { margin-top: .9rem; font-size: .74rem; color: #98a0b0; }
  .keys kbd {
    font-family: inherit; font-size: .72rem; background: #f1f3f8;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: .05rem .32rem; color: var(--muted);
  }

  /* ---------- fim de sessão ---------- */
  .done { text-align: center; }
  .done .emoji { font-size: 2.8rem; line-height: 1; }
  .done h2 { font-size: 1.35rem; margin: .7rem 0 .3rem; letter-spacing: -.01em; }
  .done p { color: var(--muted); font-size: .92rem; max-width: 26em; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; margin: 1.5rem 0 1.2rem; }
  .stat { background: #f7f9fd; border: 1px solid var(--line); border-radius: 14px; padding: .8rem .4rem; }
  .stat b { display: block; font-size: 1.4rem; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat span { font-size: .74rem; color: var(--muted); font-weight: 600; }
  .btn-primary {
    font: inherit; font-size: .95rem; font-weight: 700; cursor: pointer; color: #fff;
    background: linear-gradient(140deg, #5581f7, #3b5bdb); border: none;
    border-radius: 13px; padding: .8rem 1.3rem;
    box-shadow: 0 10px 20px -12px rgba(59,91,219,.9);
    transition: filter .15s, transform .1s;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:active { transform: scale(.98); }

  .foot { text-align: center; font-size: .76rem; color: #98a0b0; margin-top: 1.4rem; }

  button:focus-visible, a:focus-visible, select:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  @media (max-width: 600px) {
    .head-inner { padding: .6rem .8rem; }
    .brand { font-size: .9rem; }
    .brand em { display: none; }
    .card { padding: 1.3rem 1rem 1.2rem; border-radius: 18px; }
    .sentence { margin-bottom: 1.3rem; }
    .ratings { gap: .4rem; }
    .ratings button { font-size: .88rem; min-height: 66px; }
    .ratings button small { font-size: .7rem; }
    .keys { display: none; }
    .play { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">🎧 1000 English <em>Sentences</em></div>
    <nav>
      <a href="index.html">Lista</a>
      <a href="practice.html">Fila</a>
      <span class="current">Revisão</span>
    </nav>
  </div>
</header>

<div class="wrap">

  <div class="banner hidden" id="import-banner">
    <span id="import-text"></span>
    <span class="linkbtns">
      <button class="mini" id="import-yes">Importar</button>
      <button class="mini" id="import-no">Ignorar</button>
    </span>
  </div>

  <div class="statusbar">
    <div class="pills">
      <span class="pill"><i class="dot-new"></i>Novas <b id="c-new">0</b></span>
      <span class="pill"><i class="dot-due"></i>Revisão <b id="c-due">0</b></span>
      <span class="pill"><i class="dot-relearn"></i>Reaprender <b id="c-relearn">0</b></span>
    </div>
    <button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="panel">⚙ Ajustes</button>
  </div>

  <div class="progress"><span id="bar"></span></div>

  <div class="panel hidden" id="panel">
    <div class="prow">
      <label for="new-per-day">Frases novas por dia</label>
      <select id="new-per-day">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
      </select>
    </div>
    <div class="prow">
      <label>Progresso</label>
      <span class="linkbtns">
        <button class="mini" id="export">Exportar</button>
        <button class="mini" id="import">Importar</button>
        <button class="mini danger" id="reset">Reiniciar</button>
      </span>
    </div>
    <div class="prow">
      <label>Total iniciado</label>
      <span id="learned-info" style="color:var(--muted);font-size:.85rem"></span>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" class="hidden">
  </div>

  <div class="card" id="study">
    <div class="card-top">
      <span class="numbadge" id="card-num">#1</span>
      <span class="tag tag-new" id="card-tag">Nova</span>
    </div>

    <div class="sentence" id="sentence"></div>

    <button class="play" id="play" type="button" aria-label="Ouvir a pronúncia">
      <span class="ico" id="play-ico">▶</span><span>Ouvir</span>
    </button>
    <div class="hint" id="hint">Leia em voz alta e depois ouça para conferir</div>

    <div class="ratings" id="ratings">
      <button class="r-again" data-r="again" type="button">De novo<small id="p-again">nesta sessão</small></button>
      <button class="r-hard"  data-r="hard"  type="button">Difícil<small id="p-hard">1 dia</small></button>
      <button class="r-good"  data-r="good"  type="button">Bom<small id="p-good">1 dia</small></button>
    </div>

    <div class="keys">
      <kbd>espaço</kbd> ouvir &nbsp;·&nbsp; <kbd>1</kbd> de novo &nbsp;·&nbsp; <kbd>2</kbd> difícil &nbsp;·&nbsp; <kbd>3</kbd> bom
    </div>
  </div>

  <div class="card done hidden" id="done">
    <div class="emoji" id="done-emoji">🎉</div>
    <h2 id="done-title">Tudo em dia!</h2>
    <p id="done-text"></p>
    <div class="stats">
      <div class="stat"><b id="s-today">0</b><span>hoje</span></div>
      <div class="stat"><b id="s-streak">0</b><span>dias seguidos</span></div>
      <div class="stat"><b id="s-learned">0</b><span>de 1000</span></div>
    </div>
    <button class="btn-primary hidden" id="more" type="button">Estudar mais 10 frases novas</button>
  </div>

  <div class="foot">Seu progresso fica salvo neste navegador.</div>
</div>

<script src="sentences.js"></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------ dados
  var KEY = 'speaker.srs.v1';
  var OLD_KEY = 'speaker.practicedSentences';
  var TOTAL = SENTENCES.length;
  var MIN_EF = 1.3, MAX_IVL = 365;

  function dateStr(d) {
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }
  function addDays(days) {
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + days);
    return dateStr(d);
  }
  var TODAY = dateStr(new Date());

  function defaults() {
    return { v: 1, cards: {}, days: {}, newDays: {}, settings: { newPerDay: 20 } };
  }
  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEY));
      if (!raw || typeof raw !== 'object') return defaults();
      var d = defaults();
      return {
        v: 1,
        cards: raw.cards && typeof raw.cards === 'object' ? raw.cards : d.cards,
        days: raw.days && typeof raw.days === 'object' ? raw.days : d.days,
        newDays: raw.newDays && typeof raw.newDays === 'object' ? raw.newDays : d.newDays,
        settings: { newPerDay: Number(raw.settings && raw.settings.newPerDay) || 20 }
      };
    } catch (e) { return defaults(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  var store = load();

  // -------------------------------------------------------------- elementos
  var $ = function (id) { return document.getElementById(id); };
  var elStudy = $('study'), elDone = $('done'), elPanel = $('panel');
  var elNum = $('card-num'), elTag = $('card-tag'), elSentence = $('sentence');
  var elPlay = $('play'), elPlayIco = $('play-ico'), elHint = $('hint');
  var elBar = $('bar');
  var prev = { again: $('p-again'), hard: $('p-hard'), good: $('p-good') };
  var HINT = 'Leia em voz alta e depois ouça para conferir';

  // ------------------------------------------------------------------ áudio
  var audio = new Audio();
  var preloader = new Audio();
  preloader.preload = 'auto';

  function src(n) { return 'audio/' + String(n).padStart(4, '0') + '.mp3'; }

  function stopAudio() {
    audio.pause();
    elPlay.classList.remove('playing');
    elPlayIco.textContent = '▶';
  }
  function play(n) {
    if (audio.src.indexOf(src(n)) === -1) audio.src = src(n);
    audio.currentTime = 0;
    var p = audio.play();
    if (p && p.catch) p.catch(function () { stopAudio(); });
    elPlay.classList.add('playing');
    elPlayIco.textContent = '⏸';
  }
  audio.addEventListener('ended', stopAudio);
  audio.addEventListener('pause', function () {
    elPlay.classList.remove('playing');
    elPlayIco.textContent = '▶';
  });
  audio.addEventListener('error', function () {
    stopAudio();
    elHint.textContent = 'Não foi possível carregar o áudio desta frase.';
  });

  // ------------------------------------------------------------ agendamento
  function newCard() { return { d: TODAY, i: 0, e: 2.5, r: 0, l: 0 }; }

  // Intervalo em dias que cada botão aplicaria (0 = volta ainda nesta sessão).
  function nextIvl(card, rating) {
    if (rating === 'again') return 0;
    if (rating === 'hard') {
      if (card.r === 0) return 1;
      if (card.r === 1) return 2;
      return Math.min(MAX_IVL, Math.max(card.i + 1, Math.round(card.i * 1.2)));
    }
    if (card.r === 0) return 1;
    if (card.r === 1) return 3;
    return Math.min(MAX_IVL, Math.max(card.i + 1, Math.round(card.i * card.e)));
  }

  function apply(card, rating) {
    if (rating === 'again') {
      card.e = Math.max(MIN_EF, card.e - 0.2);
      if (card.r > 0) card.l += 1;
      card.r = 0;
      card.i = 0;
      card.d = TODAY;
      return;
    }
    if (rating === 'hard') card.e = Math.max(MIN_EF, card.e - 0.15);
    else card.e = Math.min(2.8, card.e + 0.05);
    card.i = nextIvl(card, rating);
    card.r += 1;
    card.d = addDays(card.i);
  }

  function fmtIvl(days) {
    if (days === 0) return 'nesta sessão';
    if (days === 1) return '1 dia';
    if (days < 30) return days + ' dias';
    if (days < 365) {
      var m = Math.round(days / 30);
      return m + (m === 1 ? ' mês' : ' meses');
    }
    return '1 ano';
  }

  // --------------------------------------------------------------- sessão
  var queue = [], current = null;
  var doneCount = 0, extraNew = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function seenCount() { return Object.keys(store.cards).length; }

  function buildSession() {
    var due = [];
    for (var k in store.cards) {
      if (store.cards[k].d <= TODAY) due.push(Number(k));
    }
    shuffle(due);

    var allowed = Math.max(0, store.settings.newPerDay + extraNew - (store.newDays[TODAY] || 0));
    var fresh = [];
    for (var n = 1; n <= TOTAL && fresh.length < allowed; n++) {
      if (!store.cards[n]) fresh.push(n);
    }

    queue = due.concat(fresh);
    doneCount = 0;
  }

  function counts() {
    var c = { nw: 0, due: 0, re: 0 };
    var all = current ? [current].concat(queue) : queue.slice();
    all.forEach(function (n) {
      var card = store.cards[n];
      if (!card) c.nw += 1;
      else if (card.r === 0) c.re += 1;
      else c.due += 1;
    });
    return c;
  }

  function renderStatus() {
    var c = counts();
    $('c-new').textContent = c.nw;
    $('c-due').textContent = c.due;
    $('c-relearn').textContent = c.re;
    var left = queue.length + (current ? 1 : 0);
    var total = doneCount + left;
    elBar.style.width = (total === 0 ? 100 : (doneCount / total) * 100) + '%';
    $('learned-info').textContent = seenCount() + ' de ' + TOTAL + ' frases';
  }

  function showCard() {
    var card = store.cards[current];

    elNum.textContent = '#' + current;
    if (!card) { elTag.textContent = 'Nova'; elTag.className = 'tag tag-new'; }
    else if (card.r === 0) { elTag.textContent = 'Reaprender'; elTag.className = 'tag tag-relearn'; }
    else { elTag.textContent = 'Revisão'; elTag.className = 'tag tag-due'; }

    elSentence.innerHTML = SENTENCES[current - 1];
    elHint.textContent = HINT;

    var base = card || newCard();
    prev.again.textContent = 'nesta sessão';
    prev.hard.textContent = fmtIvl(nextIvl(base, 'hard'));
    prev.good.textContent = fmtIvl(nextIvl(base, 'good'));

    // O áudio é conferência: nunca toca sozinho, só deixa pronto.
    stopAudio();
    audio.src = src(current);
    if (queue.length) preloader.src = src(queue[0]);

    renderStatus();
  }

  function next() {
    if (!queue.length) { current = null; finish(); return; }
    current = queue.shift();
    showCard();
  }

  function rate(rating) {
    if (current === null) return;
    var n = current;
    var wasNew = !store.cards[n];
    var card = store.cards[n] || newCard();

    apply(card, rating);
    store.cards[n] = card;
    if (wasNew) store.newDays[TODAY] = (store.newDays[TODAY] || 0) + 1;
    store.days[TODAY] = (store.days[TODAY] || 0) + 1;
    doneCount += 1;
    save();

    if (rating === 'again') queue.splice(Math.min(4, queue.length), 0, n);
    next();
  }

  // ----------------------------------------------------------------- fim
  function streak() {
    var s = 0;
    var d = new Date(); d.setHours(12, 0, 0, 0);
    if (!store.days[dateStr(d)]) d.setDate(d.getDate() - 1);
    while (store.days[dateStr(d)]) { s += 1; d.setDate(d.getDate() - 1); }
    return s;
  }

  function nextDue() {
    var best = null;
    for (var k in store.cards) {
      var d = store.cards[k].d;
      if (d > TODAY && (best === null || d < best)) best = d;
    }
    return best;
  }

  function daysUntil(dstr) {
    var a = new Date(TODAY + 'T12:00:00');
    var b = new Date(dstr + 'T12:00:00');
    return Math.round((b - a) / 86400000);
  }

  function finish() {
    stopAudio();
    elStudy.classList.add('hidden');
    elDone.classList.remove('hidden');

    var today = store.days[TODAY] || 0;
    $('s-today').textContent = today;
    $('s-streak').textContent = streak();
    $('s-learned').textContent = seenCount();

    var remainingNew = TOTAL - seenCount();
    var nd = nextDue();
    var msg = today === 0
      ? 'Nada para revisar agora.'
      : 'Você praticou ' + today + (today === 1 ? ' frase hoje.' : ' frases hoje.');
    if (nd) {
      var k = daysUntil(nd);
      msg += ' Próxima revisão ' + (k <= 1 ? 'amanhã.' : 'em ' + k + ' dias.');
    }
    if (remainingNew === 0) msg += ' Você já começou todas as ' + TOTAL + ' frases.';
    $('done-text').textContent = msg;
    $('done-title').textContent = today === 0 ? 'Tudo em dia!' : 'Sessão concluída!';
    $('done-emoji').textContent = today === 0 ? '☕' : '🎉';
    $('more').classList.toggle('hidden', remainingNew === 0);
    renderStatus();
  }

  function restart() {
    elDone.classList.add('hidden');
    elStudy.classList.remove('hidden');
    buildSession();
    if (!queue.length) { finish(); return; }
    next();
  }

  // ------------------------------------------------------------- eventos
  elPlay.addEventListener('click', function () {
    if (current === null) return;
    if (!audio.paused) { stopAudio(); return; }
    play(current);
  });

  $('ratings').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-r]');
    if (b) rate(b.dataset.r);
  });

  $('more').addEventListener('click', function () {
    extraNew += 10;
    restart();
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.tagName && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
    if (!elDone.classList.contains('hidden')) return;
    if (current === null) return;

    if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      if (!audio.paused && (e.key === ' ' || e.key === 'Enter')) stopAudio();
      else play(current);
      return;
    }
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      e.preventDefault();
      rate({ '1': 'again', '2': 'hard', '3': 'good' }[e.key]);
    }
  });

  // ------------------------------------------------------------- ajustes
  var gear = $('gear');
  gear.addEventListener('click', function () {
    var open = !elPanel.classList.toggle('hidden');
    gear.setAttribute('aria-expanded', String(open));
  });

  var selNew = $('new-per-day');
  selNew.value = String(store.settings.newPerDay);
  selNew.addEventListener('change', function () {
    store.settings.newPerDay = Number(selNew.value);
    save();
    if (!elDone.classList.contains('hidden')) { restart(); return; }

    // Sessão em andamento: acerta a quantidade de novas ainda na fila.
    var allowed = Math.max(0, store.settings.newPerDay + extraNew - (store.newDays[TODAY] || 0));
    var inQueue = queue.filter(function (n) { return !store.cards[n]; }).length;
    var diff = allowed - inQueue - (current !== null && !store.cards[current] ? 1 : 0);
    for (var n = 1; n <= TOTAL && diff > 0; n++) {
      if (!store.cards[n] && queue.indexOf(n) === -1 && n !== current) { queue.push(n); diff -= 1; }
    }
    for (var i = queue.length - 1; i >= 0 && diff < 0; i--) {
      if (!store.cards[queue[i]]) { queue.splice(i, 1); diff += 1; }
    }
    renderStatus();
  });

  $('export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'speaker-progresso-' + TODAY + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  $('import').addEventListener('click', function () { $('import-file').click(); });
  $('import-file').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || typeof data.cards !== 'object') throw new Error('formato');
        if (!confirm('Substituir o progresso atual pelo arquivo importado?')) return;
        localStorage.setItem(KEY, JSON.stringify(data));
        location.reload();
      } catch (err) {
        alert('Arquivo inválido.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  $('reset').addEventListener('click', function () {
    if (!confirm('Isso apaga todo o seu progresso de revisão. Continuar?')) return;
    if (!confirm('Tem certeza? Não dá para desfazer.')) return;
    store = defaults();
    save();
    location.reload();
  });

  // ------------------------------ importar da página "Practice queue"
  (function () {
    if (seenCount() > 0) return;
    var old;
    try { old = JSON.parse(localStorage.getItem(OLD_KEY) || '[]'); } catch (e) { return; }
    if (!Array.isArray(old) || !old.length) return;
    var nums = old.map(Number).filter(function (n) { return Number.isInteger(n) && n >= 1 && n <= TOTAL; });
    if (!nums.length) return;

    var banner = $('import-banner');
    $('import-text').textContent = 'Encontramos ' + nums.length +
      ' frases marcadas como praticadas na página antiga. Trazer para a revisão?';
    banner.classList.remove('hidden');
    $('import-yes').addEventListener('click', function () {
      nums.forEach(function (n, idx) {
        var c = newCard();
        c.r = 2; c.i = 3;
        c.d = addDays(1 + (idx % 5));
        store.cards[n] = c;
      });
      save();
      location.reload();
    });
    $('import-no').addEventListener('click', function () { banner.classList.add('hidden'); });
  })();

  // ------------------------------------------------------------- arranque
  buildSession();
  if (!queue.length) finish();
  else next();
})();
</script>
</body>
</html>
